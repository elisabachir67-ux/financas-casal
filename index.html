<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Elisa & Fernanda</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --verde-arvore: #2d5a27; 
            --verde-claro: #4a7c43; 
            --branco: #ffffff;
            --bege: #f5f5dc; 
            --bege-escuro: #e8e8d0; 
            --texto: #333;
            --vermelho: #c0392b; 
            --sombra: 0 4px 15px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bege); color: var(--texto); min-height: 100vh; }
        .hidden { display: none !important; }

        /* LOGIN CSS */
        #login-screen { position: fixed; inset: 0; background: linear-gradient(to bottom, #0f2027, #203a43, #2d5a27); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); padding: 3rem; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        
        header { background: var(--verde-arvore); color: var(--branco); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        .btn-logout { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 12px; border-radius: 8px; color: var(--branco); cursor: pointer; font-size: 0.8rem; }

        nav { background: var(--bege-escuro); padding: 15px; display: flex; justify-content: center; gap: 8px; overflow-x: auto; position: sticky; top: 0; z-index: 100; }
        .nav-btn { background: var(--branco); border: 1px solid var(--verde-arvore); padding: 8px 18px; border-radius: 25px; cursor: pointer; color: var(--verde-arvore); font-weight: 600; white-space: nowrap; }
        .nav-btn.active { background: var(--verde-arvore); color: var(--branco); }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: var(--branco); padding: 25px; border-radius: 15px; box-shadow: var(--sombra); margin-bottom: 25px; }
        h2 { color: var(--verde-arvore); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        input, select, button { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; width: 100%; margin-bottom: 10px; }
        .btn-add { background: var(--verde-arvore); color: var(--branco); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .registro-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #eee; }
        .btn-delete { color: var(--vermelho); cursor: pointer; border: none; background: none; width: auto; }
        .multi-select { height: 120px !important; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <i class="fas fa-heart" style="font-size: 3.5rem; color: var(--verde-arvore); margin-bottom: 1rem;"></i>
        <h1>Fernanceiro</h1>
        <p style="margin-bottom: 1.5rem; color: #666;">Gestão Financeira & Sonhos</p>
        <input type="password" id="login-pass" placeholder="Senha de Acesso" onkeypress="if(event.key === 'Enter') doLogin()">
        <button class="btn-add" onclick="doLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" class="hidden">
    <header>
        <div style="width: 50px;"></div>
        <h3><i class="fas fa-tree"></i> Gestão Elisa & Fernanda</h3>
        <button class="btn-logout" onclick="location.reload()">Sair</button>
    </header>
    
    <nav>
        <button class="nav-btn active" onclick="nav('entradas', this)"><i class="fas fa-arrow-down"></i> Entradas</button>
        <button class="nav-btn" onclick="nav('saidas', this)"><i class="fas fa-arrow-up"></i> Saídas</button>
        <button class="nav-btn" onclick="nav('fixos', this)"><i class="fas fa-thumbtack"></i> Fixos</button>
        <button class="nav-btn" onclick="nav('viagens', this)"><i class="fas fa-plane"></i> Viagens</button>
        <button class="nav-btn" onclick="nav('dashboard', this)"><i class="fas fa-chart-pie"></i> Resumo</button>
    </nav>

    <div class="container">
        <section id="sec-entradas" class="card">
            <h2><i class="fas fa-arrow-up"></i> Registrar Entrada</h2>
            <select id="ent-owner"><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="ent-desc"><option>💰 Salário</option><option>📈 Investimento</option><option>🎁 Paitrocínio</option></select>
            <input type="number" id="ent-val" step="0.01" placeholder="Valor R$">
            <input type="date" id="ent-date">
            <button class="btn-add" onclick="saveData('entries', 'ent')">Salvar Entrada</button>
        </section>

        <section id="sec-saidas" class="card hidden">
            <h2><i class="fas fa-arrow-down"></i> Saída Variável</h2>
            <select id="sai-owner"><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="sai-desc">
                <option>🍴 Alimentação</option><option>💳 Cartão de Crédito</option><option>🛒 Mercado</option>
                <option>🚗 Uber</option><option>🔑 Locação de Carro</option><option>🎡 Passeios</option>
                <option>✈️ Viagem</option><option>🏥 Saúde</option>
            </select>
            <input type="number" id="sai-val" step="0.01" placeholder="Valor R$">
            <input type="date" id="sai-date">
            <button class="btn-add" onclick="saveData('outs', 'sai')">Salvar Saída</button>
        </section>

        <section id="sec-fixos" class="card hidden">
            <h2><i class="fas fa-thumbtack"></i> Gastos Fixos</h2>
            <select id="fix-owner"><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="fix-desc">
                <option>💳 Cartão de Crédito</option><option>🧾 DAS</option><option>📱 Conta de Celular</option>
                <option>💧 Conta de Água</option><option>📺 Streamings</option>
            </select>
            <input type="number" id="fix-val" step="0.01" placeholder="Valor Mensal R$">
            <input type="month" id="fix-month">
            <button class="btn-add" onclick="saveData('fixos', 'fix')">Salvar Gasto Fixo</button>
        </section>

        <section id="sec-viagens" class="card hidden">
            <h2><i class="fas fa-plane"></i> Viagens</h2>
            <div style="background: var(--bege-escuro); padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                <input type="text" id="v-nome" placeholder="Destino (Ex: Gramado)">
                <input type="date" id="v-data">
                <div style="margin-top: 10px; border-top: 1px dashed #abb1a8; padding-top: 10px;">
                    <p style="font-weight: bold; font-size: 0.9rem;">Itens de Custo:</p>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="v-item-nome" placeholder="Ex: Passagens" style="flex:2">
                        <input type="number" id="v-item-val" placeholder="R$" style="flex:1">
                        <button onclick="addTempItem()" style="width:50px; background:var(--verde-arvore); color:white; border:none; border-radius:8px">+</button>
                    </div>
                    <div id="v-items-list" style="margin-top: 10px; background: rgba(255,255,255,0.5); border-radius: 8px; padding: 10px; display: none;"></div>
                </div>
                <button class="btn-add" onclick="createViagem()" style="margin-top: 10px;">CRIAR VIAGEM</button>
            </div>
            <div id="lista-viagens"></div>
        </section>

        <section id="sec-dashboard" class="card hidden">
            <h2><i class="fas fa-chart-bar"></i> Resumo</h2>
            <select id="dash-user" onchange="updateDash()"><option value="Todos">Todos</option><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="dash-months" class="multi-select" multiple onchange="updateDash()">
                <option value="0">Janeiro</option><option value="1">Fevereiro</option><option value="2">Março</option><option value="3">Abril</option>
                <option value="4">Maio</option><option value="5">Junho</option><option value="6">Julho</option><option value="7">Agosto</option>
                <option value="8">Setembro</option><option value="9">Outubro</option><option value="10">Novembro</option><option value="11">Dezembro</option>
            </select>
            <div style="margin-top:20px; display:flex; justify-content: space-around; font-weight: bold;">
                <p style="color:green">Entradas: <span id="res-ent">R$ 0</span></p>
                <p style="color:red">Saídas: <span id="res-sai">R$ 0</span></p>
                <p>Saldo: <span id="res-saldo">R$ 0</span></p>
            </div>
            <div style="height: 250px; margin-top:20px;"><canvas id="barChart"></canvas></div>
            <div id="historico-registros" style="margin-top:20px;"></div>
        </section>
    </div>
</div>

<script>
    // 1. Configuração e Inicialização
    const firebaseConfig = {
        apiKey: "AIzaSyAjXyxGsIRmkJ83vUQvcovBh-ZpaZE7Qkc",
        authDomain: "financas-casal-dd5fe.firebaseapp.com",
        projectId: "financas-casal-dd5fe",
        storageBucket: "financas-casal-dd5fe.firebasestorage.app",
        messagingSenderId: "775987268991",
        appId: "1:775987268991:web:afe10e5e99faea281c9e4a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let state = { entries: [], outs: [], fixos: [], viagens: [] };
    let tempItems = [];
    let barChart;

    // 2. Login e Navegação
    function doLogin() {
        if (document.getElementById('login-pass').value === "1234") {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initSync();
        } else {
            Swal.fire('Erro', 'Senha incorreta', 'error');
        }
    }

    function nav(id, btn) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+id).classList.remove('hidden');
        btn.classList.add('active');
        if(id === 'dashboard') updateDash();
        if(id === 'viagens') renderViagens();
    }

    // 3. Sincronização Única
    function initSync() {
        db.collection("dados").doc("financeiro_vfinal").onSnapshot(doc => {
            if(doc.exists) {
                state = doc.data();
                state.entries = state.entries || [];
                state.outs = state.outs || [];
                state.fixos = state.fixos || [];
                state.viagens = state.viagens || [];
                updateDash();
                renderViagens();
            }
        });
    }

    async function persist() {
        try {
            await db.collection("dados").doc("financeiro_vfinal").set(state);
        } catch(e) { console.error("Erro ao salvar:", e); }
    }

    // 4. Registro de Dados
    async function saveData(type, prefix) {
        const val = parseFloat(document.getElementById(prefix+'-val').value);
        const desc = document.getElementById(prefix+'-desc').value;
        const owner = document.getElementById(prefix+'-owner').value;
        let date = document.getElementById(prefix+'-date')?.value || document.getElementById(prefix+'-month')?.value;

        if(!val || !desc) return Swal.fire('Aviso','Preencha os campos!','warning');
        if(!date) date = new Date().toISOString().split('T')[0];
        if(date.length === 7) date += "-01";

        state[type].push({ val, desc, date, owner, id: Date.now() });
        await persist();
        document.getElementById(prefix+'-val').value = '';
        Swal.fire('Sucesso','Registro salvo!','success');
    }

    async function deleteItem(type, id) {
        const res = await Swal.fire({ title: 'Excluir?', showCancelButton: true });
        if (res.isConfirmed) {
            state[type] = state[type].filter(i => i.id !== id);
            await persist();
        }
    }

    // 5. Lógica de Viagens
    function addTempItem() {
        const nome = document.getElementById('v-item-nome').value;
        const valor = parseFloat(document.getElementById('v-item-val').value);
        if(!nome || isNaN(valor)) return;
        tempItems.push({ id: Date.now(), nome, valor });
        document.getElementById('v-item-nome').value = '';
        document.getElementById('v-item-val').value = '';
        renderTempList();
    }

    function renderTempList() {
        const div = document.getElementById('v-items-list');
        div.style.display = 'block';
        div.innerHTML = tempItems.map(i => `<div>• ${i.nome}: R$ ${i.valor.toFixed(2)}</div>`).join('');
    }

    async function createViagem() {
        const nome = document.getElementById('v-nome').value;
        if(!nome) return Swal.fire('Aviso','Digite o destino','warning');
        
        state.viagens.push({
            id: Date.now(),
            nome: nome,
            data: document.getElementById('v-data').value || "A definir",
            total: tempItems.reduce((a,b) => a + b.valor, 0),
            juntado: 0,
            itens: [...tempItems]
        });
        
        tempItems = [];
        document.getElementById('v-items-list').style.display = 'none';
        document.getElementById('v-nome').value = '';
        await persist();
        renderViagens();
    }

    function renderViagens() {
        const div = document.getElementById('lista-viagens');
        div.innerHTML = (state.viagens || []).map(v => {
            const perc = v.total > 0 ? (v.juntado / v.total) * 100 : 0;
            return `
                <div class="card" style="border-left: 5px solid var(--verde-arvore)">
                    <div style="display:flex; justify-content:space-between">
                        <h3>${v.nome}</h3>
                        <button onclick="deleteViagem(${v.id})" class="btn-delete"><i class="fas fa-trash"></i></button>
                    </div>
                    <p>Meta: R$ ${v.total.toFixed(2)} | Juntado: R$ ${v.juntado.toFixed(2)}</p>
                    <div style="background:#eee; height:10px; border-radius:5px; margin: 10px 0">
                        <div style="width:${perc}%; height:100%; background:var(--verde-arvore); border-radius:5px"></div>
                    </div>
                    <button class="btn-add" onclick="addMoneyV(${v.id})">+ GUARDAR</button>
                </div>`;
        }).join('');
    }

    async function deleteViagem(id) {
        state.viagens = state.viagens.filter(v => v.id !== id);
        await persist();
    }

    async function addMoneyV(id) {
        const { value: val } = await Swal.fire({ title: 'Valor', input: 'number' });
        if(val) {
            const v = state.viagens.find(x => x.id === id);
            v.juntado += parseFloat(val);
            await persist();
            renderViagens();
        }
    }

    // 6. Dashboard
    function updateDash() {
        const user = document.getElementById('dash-user').value;
        const selMonths = Array.from(document.getElementById('dash-months').selectedOptions).map(o => parseInt(o.value));
        const filterFn = (i) => (user === "Todos" || i.owner === user) && (selMonths.length === 0 || selMonths.includes(new Date(i.date + "T00:00:00").getMonth()));
        
        const ent = state.entries.filter(filterFn).reduce((a,b)=>a+b.val, 0);
        const sai = state.outs.filter(filterFn).reduce((a,b)=>a+b.val, 0) + state.fixos.filter(filterFn).reduce((a,b)=>a+b.val, 0);
        const saldo = ent - sai;

        document.getElementById('res-ent').innerText = `R$ ${ent.toFixed(2)}`;
        document.getElementById('res-sai').innerText = `R$ ${sai.toFixed(2)}`;
        document.getElementById('res-saldo').innerText = `R$ ${saldo.toFixed(2)}`;

        const ctx = document.getElementById('barChart').getContext('2d');
        if(barChart) barChart.destroy();
        barChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Entradas', 'Saídas', 'Saldo'],
                datasets: [{ data: [ent, sai, saldo], backgroundColor: ['#27ae60', '#c0392b', '#2980b9'] }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const all = [...state.entries.map(i=>({...i,t:'E'})), ...state.outs.map(i=>({...i,t:'S'})), ...state.fixos.map(i=>({...i,t:'F'}))]
                    .filter(filterFn).sort((a,b)=>new Date(b.date)-new Date(a.date));

        document.getElementById('historico-registros').innerHTML = all.map(i => `
            <div class="registro-item">
                <span>${i.date} - [${i.t}] ${i.desc}: R$ ${i.val.toFixed(2)}</span>
                <button class="btn-delete" onclick="deleteItem('${i.t==='E'?'entries':i.t==='S'?'outs':'fixos'}', ${i.id})"><i class="fas fa-trash"></i></button>
            </div>`).join('');
    }
</script>
</body>
</html>
