<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Elisa & Fernanda</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --verde-arvore: #2d5a27; 
            --verde-claro: #4a7c43; 
            --branco: #ffffff;
            --bege: #f5f5dc; 
            --bege-escuro: #e8e8d0; 
            --texto: #333;
            --vermelho: #c0392b; 
            --sombra: 0 4px 15px rgba(0,0,0,0.1);
            --rosa-milestone: #a58282;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bege); color: var(--texto); min-height: 100vh; }
        .hidden { display: none !important; }

        /* --- LOGIN CSS --- */
        #login-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2d5a27);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            overflow: hidden;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: relative;
            z-index: 2001;
        }

        .login-box.error { animation: shake 0.5s; border: 1px solid var(--vermelho); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .circles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
        .circles li { position: absolute; list-style: none; display: block; background: rgba(255, 255, 255, 0.2); animation: animate 25s linear infinite; bottom: -150px; color: rgba(255, 255, 255, 0.3); font-size: 2rem; }
        
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; }
        .circles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        
        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        header { background: var(--verde-arvore); color: var(--branco); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: relative; }
        .btn-logout { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 12px; border-radius: 8px; color: var(--branco); cursor: pointer; font-size: 0.8rem; }

        nav { background: var(--bege-escuro); padding: 15px; display: flex; justify-content: center; gap: 8px; overflow-x: auto; position: sticky; top: 0; z-index: 100; }
        .nav-btn { background: var(--branco); border: 1px solid var(--verde-arvore); padding: 8px 18px; border-radius: 25px; cursor: pointer; color: var(--verde-arvore); font-weight: 600; white-space: nowrap; transition: 0.3s; }
        .nav-btn.active { background: var(--verde-arvore); color: var(--branco); }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: var(--branco); padding: 25px; border-radius: 15px; box-shadow: var(--sombra); margin-bottom: 25px; }
        h2 { color: var(--verde-arvore); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        input, select, button { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; width: 100%; margin-bottom: 10px; }
        .btn-add { background: var(--verde-arvore); color: var(--branco); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .viagem-card { border: 1px solid #eee; border-radius: 15px; padding: 20px; margin-top: 20px; position: relative; }
        .progress-bg { background: #eee; height: 14px; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: var(--verde-arvore); transition: 0.5s; width: 0%; }
        .milestones { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.75rem; }
        .milestone.active { color: var(--verde-arvore); font-weight: bold; }
        
        .registro-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #eee; }
        .btn-delete { color: var(--vermelho); cursor: pointer; border: none; background: none; width: auto; margin: 0; }
        .multi-select { height: 120px !important; }
    </style>
</head>
<body>

<div id="login-screen">
    <ul class="circles">
        <li><i class="fas fa-beer"></i></li>
        <li><i class="fas fa-futbol"></i></li>
        <li><i class="fas fa-rocket"></i></li>
        <li><i class="fas fa-star"></i></li>
        <li><i class="fas fa-beer"></i></li>
        <li><i class="fas fa-user-astronaut"></i></li>
    </ul>

    <div class="login-box">
        <i class="fas fa-heart" style="font-size: 3.5rem; color: var(--verde-arvore); margin-bottom: 1rem;"></i>
        <h1 style="color: #2d5a27;">Fernanceiro</h1>
        <p style="margin-bottom: 1.5rem; color: #666;">Gestão Financeira & Sonhos</p>
        <input type="password" id="login-pass" placeholder="Senha de Acesso" onkeypress="if(event.key === 'Enter') doLogin()">
        <button class="btn-add" onclick="doLogin()">ENTRAR</button>
    </div>
</div>

<div id="app" class="hidden">
    <header>
        <div style="width: 50px;"></div>
        <h3><i class="fas fa-tree"></i> Gestão Elisa & Fernanda</h3>
        <button class="btn-logout" onclick="location.reload()">Sair</button>
    </header>
    
    <nav>
        <button class="nav-btn active" onclick="nav('entradas', this)"><i class="fas fa-arrow-down"></i> Entradas</button>
        <button class="nav-btn" onclick="nav('saidas', this)"><i class="fas fa-arrow-up"></i> Saídas</button>
        <button class="nav-btn" onclick="nav('fixos', this)"><i class="fas fa-thumbtack"></i> Fixos</button>
        <button class="nav-btn" onclick="nav('viagens', this)"><i class="fas fa-plane"></i> Viagens</button>
        <button class="nav-btn" onclick="nav('dashboard', this)"><i class="fas fa-chart-pie"></i> Resumo</button>
    </nav>

    <div class="container">
        <section id="sec-entradas" class="card">
            <h2><i class="fas fa-arrow-up"></i> Registrar Entrada</h2>
            <select id="ent-owner"><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="ent-desc"><option>💰 Salário</option><option>📈 Investimento</option><option>🎁 Paitrocínio</option></select>
            <input type="number" id="ent-val" step="0.01" placeholder="Valor R$">
            <input type="date" id="ent-date">
            <button class="btn-add" onclick="saveData('entries', 'ent')">Salvar Entrada</button>
        </section>

        <section id="sec-saidas" class="card hidden">
            <h2><i class="fas fa-arrow-down"></i> Saída Variável</h2>
            <select id="sai-owner"><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="sai-desc">
                <option>🍴 Alimentação</option><option>💳 Cartão de Crédito</option><option>🛒 Mercado</option>
                <option>🚗 Uber</option><option>🔑 Locação de Carro</option><option>🎡 Passeios</option>
                <option>✈️ Viagem</option><option>🏥 Saúde</option><option>🎓 Educação</option><option>👕 Vestuário</option>
            </select>
            <input type="number" id="sai-val" step="0.01" placeholder="Valor R$">
            <input type="date" id="sai-date">
            <button class="btn-add" onclick="saveData('outs', 'sai')">Salvar Saída</button>
        </section>

        <section id="sec-fixos" class="card hidden">
            <h2><i class="fas fa-thumbtack"></i> Gastos Fixos</h2>
            <select id="fix-owner"><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="fix-desc">
                <option>💳 Cartão de Crédito</option><option>🧾 DAS</option><option>📱 Conta de Celular</option>
                <option>💧 Conta de Água</option><option>💄 Cosméticos</option><option>📺 Streamings</option>
            </select>
            <input type="number" id="fix-val" step="0.01" placeholder="Valor Mensal R$">
            <input type="month" id="fix-month">
            <button class="btn-add" onclick="saveData('fixos', 'fix')">Salvar Gasto Fixo</button>
        </section>

        <section id="sec-viagens" class="card hidden">
            <h2><i class="fas fa-plane"></i> Viagens</h2>
            <input type="text" id="via-destino" placeholder="Destino (ex: Vitória)">
            <input type="date" id="via-data">
            <div style="background: #fdfdfd; padding: 15px; border: 1px dashed #ccc; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin-bottom: 10px; font-weight: bold; font-size: 0.9rem;">Itens de Custo:</p>
                <div style="display: flex; gap: 5px;">
                    <select id="via-cat-nome"><option>Hospedagem</option><option>Passagem</option><option>Alimentação</option><option>Passeios</option></select>
                    <input type="number" id="via-cat-valor" placeholder="R$">
                    <button onclick="addCatItem()" style="width: 50px; background: var(--verde-arvore); color: white; border: none; border-radius: 8px;">+</button>
                </div>
                <div id="temp-cats" style="font-size: 0.85rem; margin-top: 5px;"></div>
            </div>
            <button class="btn-add" onclick="saveViagem()">Criar Viagem</button>
            <div id="lista-viagens"></div>
        </section>

        <section id="sec-dashboard" class="card hidden">
            <h2><i class="fas fa-chart-bar"></i> Resumo</h2>
            <select id="dash-user" onchange="updateDash()"><option value="Todos">Todos</option><option>Elisa</option><option>Fernanda</option><option>Conjunto</option></select>
            <select id="dash-months" class="multi-select" multiple onchange="updateDash()">
                <option value="0">Janeiro</option><option value="1">Fevereiro</option><option value="2">Março</option><option value="3">Abril</option>
                <option value="4">Maio</option><option value="5">Junho</option><option value="6">Julho</option><option value="7">Agosto</option>
                <option value="8">Setembro</option><option value="9">Outubro</option><option value="10">Novembro</option><option value="11">Dezembro</option>
            </select>
            <div style="margin-top:20px; display:flex; flex-wrap: wrap; gap:20px; justify-content: center;">
                <p>Entradas: <span id="res-ent" style="color:green; font-weight:bold;">R$ 0</span></p>
                <p>Saídas: <span id="res-sai" style="color:red; font-weight:bold;">R$ 0</span></p>
                <p>Saldo: <span id="res-saldo" style="font-weight:bold;">R$ 0</span></p>
            </div>
            <div style="height: 250px; margin-top:20px;"><canvas id="barChart"></canvas></div>
            <h2 style="margin-top:40px;"><i class="fas fa-list"></i> Histórico</h2>
            <div id="historico-registros"></div>
        </section>
    </div>
</div>

<script>
    // Configuração Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAjXyxGsIRmkJ83vUQvcovBh-ZpaZE7Qkc",
        authDomain: "financas-casal-dd5fe.firebaseapp.com",
        projectId: "financas-casal-dd5fe",
        storageBucket: "financas-casal-dd5fe.firebasestorage.app",
        messagingSenderId: "775987268991",
        appId: "1:775987268991:web:afe10e5e99faea281c9e4a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let state = { entries: [], outs: [], fixos: [], viagens: [] };
    let itensTemp = [];
    let isInitialLoad = true;

    // Login
    function doLogin() {
        const passInput = document.getElementById('login-pass');
        if (passInput.value === "1234") {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initSync();
        } else {
            Swal.fire({ icon: 'error', title: 'Senha Incorreta', timer: 1500, showConfirmButton: false });
            document.querySelector('.login-box').classList.add('error');
            setTimeout(() => document.querySelector('.login-box').classList.remove('error'), 500);
        }
    }

    // Navegação
    function nav(id, btn) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('sec-'+id).classList.remove('hidden');
        btn.classList.add('active');
        if(id === 'dashboard') updateDash();
        if(id === 'viagens') renderViagens();
    }

    // Sincronização
    function initSync() {
        db.collection("dados").doc("financeiro_vfinal").onSnapshot(doc => {
            if(doc.exists) {
                state = doc.data();
                // Garantir arrays inicializados
                state.entries = state.entries || [];
                state.outs = state.outs || [];
                state.fixos = state.fixos || [];
                state.viagens = state.viagens || [];
                
                if (isInitialLoad) {
                    updateDash();
                    renderViagens();
                    isInitialLoad = false;
                }
            } else {
                db.collection("dados").doc("financeiro_vfinal").set(state);
            }
        });
    }

    // Funções de Registro
  async function saveData(type, prefix) {
    const valInput = document.getElementById(prefix + '-val');
    const descInput = document.getElementById(prefix + '-desc');
    const val = parseFloat(valInput.value);
    const desc = descInput.value;
    const owner = document.getElementById(prefix + '-owner').value;
    let dateInput = document.getElementById(prefix + '-date')?.value || document.getElementById(prefix + '-month')?.value;

    if (!val || !desc) {
        return Swal.fire('Aviso', 'Preencha o valor e a descrição!', 'warning');
    }

    if (!dateInput) dateInput = new Date().toISOString().split('T')[0];
    if (dateInput.length === 7) dateInput += "-01";

    // Adiciona ao estado local primeiro
    const novoRegistro = { val, desc, date: dateInput, owner, id: Date.now() };
    state[type].push(novoRegistro);

    try {
        // Usa SET com MERGE para garantir que crie o documento se ele não existir
        await db.collection("dados").doc("financeiro_vfinal").set(state, { merge: true });
        
        Swal.fire({
            icon: 'success',
            title: 'Salvo com sucesso!',
            timer: 1500,
            showConfirmButton: false
        });

        // Limpa apenas o campo de valor e descrição
        valInput.value = '';
        if (prefix === 'ent' || prefix === 'sai') descInput.selectedIndex = 0;
        
        updateDash();
    } catch (e) {
        console.error("Erro detalhado:", e);
        Swal.fire('Erro', 'Falha ao salvar: ' + e.message, 'error');
    }
}    async function deleteItem(type, id) {
        const res = await Swal.fire({ title: 'Excluir registro?', text: "Essa ação não pode ser desfeita.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#c0392b' });
        if (res.isConfirmed) {
            state[type] = state[type].filter(item => item.id !== id);
            await db.collection("dados").doc("financeiro_vfinal").set(state);
            updateDash();
            renderViagens();
        }
    }

    // Dashboard
    let barChart;
    function updateDash() {
        const user = document.getElementById('dash-user').value;
        const selMonths = Array.from(document.getElementById('dash-months').selectedOptions).map(o => parseInt(o.value));
        
        const filterFn = (i) => (user === "Todos" || i.owner === user) && (selMonths.length === 0 || selMonths.includes(new Date(i.date + "T00:00:00").getMonth()));
        
        const ent = (state.entries || []).filter(filterFn).reduce((a,b)=>a+b.val, 0);
        const sai = (state.outs || []).filter(filterFn).reduce((a,b)=>a+b.val, 0) + (state.fixos || []).filter(filterFn).reduce((a,b)=>a+b.val, 0);
        const saldo = ent - sai;
        
        document.getElementById('res-ent').innerText = `R$ ${ent.toFixed(2)}`;
        document.getElementById('res-sai').innerText = `R$ ${sai.toFixed(2)}`;
        document.getElementById('res-saldo').innerText = `R$ ${saldo.toFixed(2)}`;
        document.getElementById('res-saldo').style.color = saldo >= 0 ? "blue" : "red";
        
        const ctx = document.getElementById('barChart').getContext('2d');
        if(barChart) barChart.destroy();
        barChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Entradas', 'Saídas', 'Saldo'],
                datasets: [{
                    label: 'R$',
                    data: [ent, sai, saldo],
                    backgroundColor: ['#27ae60', '#c0392b', saldo >= 0 ? '#2980b9' : '#e74c3c']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const all = [
            ...(state.entries||[]).map(i=>({...i,type:'entries',l:'(E)'})),
            ...(state.outs||[]).map(i=>({...i,type:'outs',l:'(S)'})),
            ...(state.fixos||[]).map(i=>({...i,type:'fixos',l:'(F)'}))
        ].filter(filterFn).sort((a,b)=>new Date(b.date)-new Date(a.date));

        document.getElementById('historico-registros').innerHTML = all.map(i => `
            <div class="registro-item">
                <span>${i.date.split('-').reverse().join('/')} - <b>${i.l}</b> ${i.desc} (${i.owner}) - R$ ${i.val.toFixed(2)}</span>
                <button class="btn-delete" onclick="deleteItem('${i.type}', ${i.id})"><i class="fas fa-trash"></i></button>
            </div>`).join('');
    }

    // Viagens
    function addCatItem() {
        const nome = document.getElementById('via-cat-nome').value;
        const valor = parseFloat(document.getElementById('via-cat-valor').value);
        if(!valor) return;
        itensTemp.push({ nome, valor, pago: false });
        document.getElementById('via-cat-valor').value = '';
        document.getElementById('temp-cats').innerHTML = itensTemp.map(i => `• ${i.nome}: R$ ${i.valor.toFixed(2)}`).join('<br>');
    }

    async function saveViagem() {
        const destino = document.getElementById('via-destino').value;
        const data = document.getElementById('via-data').value;
        if(!destino || itensTemp.length === 0) return Swal.fire('Aviso', 'Preencha o destino e adicione itens!', 'warning');
        
        state.viagens.push({
            id: Date.now(),
            destino,
            data,
            meta: itensTemp.reduce((a, b) => a + b.valor, 0),
            juntado: 0,
            itens: [...itensTemp],
            milestones: []
        });
        
        itensTemp = [];
        document.getElementById('via-destino').value = '';
        document.getElementById('temp-cats').innerHTML = '';
        await db.collection("dados").doc("financeiro_vfinal").set(state);
        Swal.fire('Sucesso', 'Viagem criada!', 'success');
        renderViagens();
    }

    function renderViagens() {
        const div = document.getElementById('lista-viagens');
        div.innerHTML = (state.viagens || []).map(v => {
            const perc = v.meta > 0 ? (v.juntado / v.meta) * 100 : 0;
            return `
                <div class="viagem-card">
                    <div style="display:flex; justify-content:space-between;">
                        <h3>${v.destino}</h3>
                        <i class="fas fa-trash" style="color:red; cursor:pointer" onclick="deleteItem('viagens', ${v.id})"></i>
                    </div>
                    <p style="font-size:0.85rem;">Meta: R$ ${v.meta.toFixed(2)} | Juntado: R$ ${v.juntado.toFixed(2)}</p>
                    <div class="progress-bg"><div class="progress-fill" style="width:${Math.min(perc, 100)}%"></div></div>
                    <div class="milestones">
                        <span class="${perc>=25?'active':''}">25%</span>
                        <span class="${perc>=50?'active':''}">50%</span>
                        <span class="${perc>=75?'active':''}">75%</span>
                        <span class="${perc>=100?'active':''}">100%</span>
                    </div>
                    <button class="btn-add" style="margin-top:10px" onclick="addViagemVal(${v.id})">Adicionar Valor</button>
                </div>`;
        }).join('');
    }

    async function addViagemVal(id) {
        const { value: extra } = await Swal.fire({ title: 'Quanto quer guardar?', input: 'number', showCancelButton: true });
        if(!extra) return;
        const v = state.viagens.find(x => x.id === id);
        v.juntado += parseFloat(extra);
        await db.collection("dados").doc("financeiro_vfinal").set(state);
        renderViagens();
        Swal.fire('Boa!', 'Valor adicionado com sucesso', 'success');
    }
</script>
</body>
</html>
